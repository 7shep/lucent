<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Lucent Dock</title>
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="dock.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a13 13 0 0 1 19 0"/><path d="M5.5 12.5a8.5 8.5 0 0 1 13 0"/><path d="M8.7 16a4 4 0 0 1 6.6 0"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-ethernet" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="11" rx="2"/><path d="M9 14v3.5h6V14M12 17.5V21"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-chev-up" viewBox="0 0 24 24"><path d="M6 14.5l6-6 6 6"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.7 6.9a8 8 0 1 0 10.6 0"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-night" viewBox="0 0 24 24"><path d="M3 16h18"/><path d="M6.5 16a5.5 5.5 0 0 1 11 0"/><path d="M12 5v3M5.5 8.5l2 2M18.5 8.5l-2 2"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M11 3.5h2v6.2l6.5 3.6v2L13 13.6V18l2.5 1.6V21L12 20.2 8.5 21v-1.4L11 18v-4.4l-6.5 1.8v-2L11 9.7z"/></symbol>
    <symbol id="i-cast" viewBox="0 0 24 24"><path d="M3 8V6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5H13"/><path d="M3 11.5a8 8 0 0 1 8 8M3 15.5a4 4 0 0 1 4 4"/><circle cx="3.5" cy="19.5" r="0.9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-bluetooth" viewBox="0 0 24 24"><path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M7 8h10v2.5a5 5 0 0 1-10 0z"/><path d="M12 15.5V21"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 5 3 3v2H7v-2l3-3z"/><path d="M12 13v8"/></symbol>
  </svg>

  <div id="dock" class="dock">
    <div id="label" class="label glass" aria-hidden="true"><span id="label-text" class="ellipsis"></span></div>

    <nav id="bar" class="bar glass" aria-label="Taskbar">
      <div class="spacer"></div>
      <div class="group">
        <button id="b-start" class="ic" type="button" aria-label="Start" aria-pressed="false"><svg class="g" aria-hidden="true"><use href="#i-grid"/></svg></button>
        <button id="b-search" class="ic" type="button" aria-label="Search" aria-pressed="false"><svg class="g" aria-hidden="true"><use href="#i-search"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <div id="items" class="group"></div>
      </div>
      <div class="spacer"></div>
      <div class="group">
        <button id="b-tray" class="ic" type="button" aria-label="Show hidden icons"><svg class="g" aria-hidden="true"><use href="#i-chev-up"/></svg></button>
        <button id="b-qs" class="hit" type="button" aria-label="Quick settings" aria-pressed="false">
          <svg id="g-wifi" class="g" aria-hidden="true"><use href="#i-wifi"/></svg>
          <svg id="g-eth" class="g" aria-hidden="true"><use href="#i-ethernet"/></svg>
          <svg id="g-vol" class="g" aria-hidden="true"><use href="#i-volume"/></svg>
          <svg id="g-mute" class="g" aria-hidden="true"><use href="#i-mute"/></svg>
        </button>
        <button id="b-clock" class="hit" type="button" aria-label="Notifications and calendar" aria-pressed="false">
          <span class="clock"><span id="time" class="clock-time"></span><span id="date" class="sm"></span></span>
          <svg class="g" aria-hidden="true"><use href="#i-bell"/></svg>
        </button>
      </div>
    </nav>
  </div>

  <script src="dock.js"></script>
</body>
</html>
